# Production stack. Only Caddy (80/443) is reachable from outside; everything else stays on the
# internal Docker network. No Mailpit: set a real SMTP provider in apps/api/.env.
#
#   pnpm build:web
#   docker compose -f docker-compose.prod.yml --env-file apps/api/.env up -d --build
#
# Required in apps/api/.env (besides the app keys): ENVIRONMENT=production, POSTGRES_PASSWORD,
# REDIS_PASSWORD, WEARVERSE_DOMAIN. Use hex passwords (openssl rand -hex 32) so they are safe in URLs.
name: wearverse

x-app-env: &app-env
  ENVIRONMENT: production
  DATABASE_URL: postgresql+psycopg://fashionos:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/fashionos
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  AI_SERVICE_URL: http://ai:8001

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: fashionos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: fashionos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fashionos"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}

  api:
    build: ./apps/api
    restart: unless-stopped
    env_file: ./apps/api/.env
    environment:
      <<: *app-env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-2} --proxy-headers --forwarded-allow-ips='*'"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    # Runs Celery worker + beat in one process: keep exactly one replica.
    build: ./apps/worker
    restart: unless-stopped
    env_file: ./apps/api/.env
    environment:
      <<: *app-env
      API_INTERNAL_URL: http://api:8000/api/v1/internal
    depends_on:
      api:
        condition: service_healthy

  ai:
    build: ./apps/ai-service
    restart: unless-stopped
    env_file: ./apps/api/.env
    environment:
      <<: *app-env

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      WEARVERSE_DOMAIN: ${WEARVERSE_DOMAIN:?set WEARVERSE_DOMAIN}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/web/dist:/srv/web:ro
      - caddydata:/data
      - caddyconfig:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  caddydata:
  caddyconfig:
